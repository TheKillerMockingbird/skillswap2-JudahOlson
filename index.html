<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-container">
      <h1 class="logo">Skill Swap</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Browse Skills</a></li>
          <li><a href="#">Offer Skills</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
  <section class="hero">
    <h2>Learn and Teach Skills with Fellow Students</h2>
    <p>Connect with verified university students to exchange knowledge through paid sessions or skill trades.</p>
    <button class="cta-button">Get Started</button>
  </section>

  <section class="skill-offerings">
    <h2>Popular Skills</h2>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Programming">Programming</button>
      <button class="filter-btn" data-category="Music">Music</button>
      <button class="filter-btn" data-category="Career">Career</button>
    </div>

    <div class="skills-grid" id="skills-container">
      <!-- Skill cards will be generated by JavaScript -->
    </div>
  </section>
</main>

  <footer>
    <p>&copy; 2026 Skill Swap. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
